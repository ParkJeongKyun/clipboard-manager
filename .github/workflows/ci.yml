name: CI

on:
  push:
    branches: [main]
  pull_request:

# 코드 읽기 권한만 (저장소 기본값과 같지만 명시)
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: Scripts/check-localization.sh
